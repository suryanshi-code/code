<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content: center;
    align-items:center;
    background:linear-gradient(
      #ececfb 2%,
      #53d3e3 10%,
      #669ab8 20%,
      #9659bc 40%,
      #7646b0 70%,
      #28054b 100%);
    background-repeat:no-repeat;
    text-align: center;
    font-family: 'orbital',sans-sarif;

  }
  


  h1 {
    color: rgb(255, 255, 255);
    font-size: 40px;
  }

  .btn{
    display:flex;
    padding: 10px 20px;
    margin: 10px;
    justify-content:center;
    color: rgb(255, 254, 255);
    outline-offset:2px solid white;
    text-decoration: none;
    border-radius: 10px;
    background:transparent;
    font-size: 40px;
    transition: 0.3s;

    backdrop-filter:blur(10px);
  
    box-shadow: 0 0 10px #a06bbd;
    width:15%;
    clip-path: polygon(
      10% 0%,
      90% 10%,
      100% 50%,
      90% 90%,
      10% 90%,
      0% 50%
    );
    z-index:1;
    position:relative
  }
  .btn::before{
    top: -5px;
    left: -5px;
    right: -5px;
    bottom: -5px;
    clip-path:inherit;

    background:rgb(89, 245, 242);
    position:absolute;
    content:"";
    z-index:-1;
  }
  .btn::after{
    top: 4px;
    left: 4px;
    right: 4px;
    bottom: 4px;

    background:linear-gradient(
    #ab53ae,
    #7646b0,
    #ececfb
    );
    position:absolute;
    content:"";
    z-index:-1;
    clip-path:inherit;
  }
  .btn:hover::after{
    background:linear-gradient(
      #ab53ae,
      #53d3e3,
      #9659bc
    )
  }
  .btn:hover{
    transform: scale(1.30);
  }
</style>
</head>
<body>
<h1>WELCOME</h1>

<a href="/login" class= "btn">LOGIN </a>
<a href="/signup"class="btn">SIGN UP</a>
</body>
</html>
