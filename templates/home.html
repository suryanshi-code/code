<!DOCTYPE html>
<html>
<head>   
<style>
   input{
    background-color:rgb(71, 206, 255);
    padding:20px;
    margin:30px;
    border-radius:30px;  
    
}
    body {
      height:100vh;
      background:linear-gradient(
       #ececfb 2%,
       #53d3e3 10%,
       #669ab8 20%,
       #9659bc 40%,
       #7646b0 70%,
       #28054b 100%);
        
      background-repeat:no-repeat;
      background-size: cover;
}

   .btn{
    background-color:rgb(50, 172, 232);
    padding:15px 35px;
    font-size: 18px;
    color:#0c010a;
    text-decoration: none;
    border-radius: 10px;
}
   .btn:hover {
    background-color: rgb(96, 48, 147);
}
   .like{
    background-color:rgb(50, 172, 232);
}
   .dislike{
    background-color:rgb(50, 172, 232);
}
   button {
    background-color: #550679;
    padding: 22px 60px;
    font-size: 22px;
    font-weight: bold;
    color: white;
    border: none;
    border-radius: 30px;
    cursor: pointer;
}
   body{
     font-family:ziglets;
}
   .post{
    background: hsl(223, 100%, 86%);
    padding: 20px;
    margin: 20px auto;
    width: 30%;
    border-radius: 20px;
    box-shadow: 0px 5px 15px rgba(0,0,0,0.2);
}
   .navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #7e3db7;
    padding: 15px;
    color: white;
}
button:hover {
    background-color: purple;
    box-shadow: 0px 4px 10px rgba(250, 76, 204, 0.882);
}

.navbar h2 {
    margin: 0;
}

</style>
      <title>FEMAGRAM</title>
</head>
<body>
    <div class="navbar">
    <h2>FEMAGRAM</h2>
    <a href="/logout" class = "btn">LOGOUT</a>
    </div>

    <form method = "POST">
      <input type = "text"  name = "name"  placeholder="ENTER YOUR NAME">
      <input type = "text"  name = "post"  placeholder="ENTER YOUR POST">
      <button type = "submit">post</button>
    </form>

{%for p in posts%}
<div class="post">
     <h1>{{p.name}}</h1>
     <p>{{p.content}}</p>
     <a class ="btn delete" href="/delete/{{p.id}}">delete</a>
     <a class ="btn like"  href="/like/{{p.id}}">Like</a>
     <p>Likes: {{p.likes }}</p>
     <a class="btn dislike" href="/dislike/{{p.id}}">Dislike</a>
     <p>Dislikes: {{p.dislikes}}</p>
     <form action="/comment/{{ p.id }}" method="POST">
           <input type="text" name="comment" placeholder="Write a comment">
           <button type="submit">Comment</button>
     </form>
     {%for c in p.comments%}
     <p>{{ c.text }}</p>
     {% endfor %}
</div>
{%endfor%}
</body>
</html>
